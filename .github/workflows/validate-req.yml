name: Validate Req native packages

on:
  push:
    branches: [fix/req-0.2.0-package-validation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Conda (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: macos-26
            platform: osx-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          pixi-version: v0.81.0
          run-install: false
      - name: Record recipe identity
        run: git rev-parse HEAD:recipes/req/recipe.yaml
      - name: Build and test installed package
        run: |
          pixi exec --spec 'rattler-build>=0.30,<0.31' -- \
            rattler-build build --recipe recipes/req \
            --variant-config variants/variants.yaml \
            -c conda-forge -c https://conda.modular.com/max \
            -c https://prefix.dev/modular-community \
            --output-dir output/req-validation --log-style plain 2>&1 | tee build-req.log
      - name: Upload package and build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: req-conda-${{ matrix.platform }}
          path: |
            output/req-validation/${{ matrix.platform }}/*.conda
            build-req.log
          if-no-files-found: error
